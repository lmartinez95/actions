name: Test

on: [push]

jobs:
  local-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: ls
        uses: ./.github/actions/my-action #Por convención, GitHub busca un archivo llamado action.yaml en la carpeta de la acción. En este caso, la acción se encuentra en .github/actions/my-action/action.yaml
        with:
          message: "Hello from local action!"