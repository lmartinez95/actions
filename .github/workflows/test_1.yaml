name: Hola Mundo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hola:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis
        ports:
          - 6379:6379
        #env:
          #MI_VAR: ${{ var.MI_VAR }} variable previamente creada en GitHub
          #MI_SECRET: ${{ secret.MI_SECRET }} secreto previamente creado en GitHub

    steps:
    #Para agregar llaves guardadas en un secreto previamente creada en GitHub
    # - name: Agrega llave ssh
    #   run: |
    #     mkdir -p ~/.ssh
    #     echo "${{ secrets.SSH_KEY }}" >> ~/.ssh/id_rsa
    #     chmod 600 ~/.ssh/id_rsa
    #     ssh-keyscan -H 127.0.1.1 #Para autoaceptar la conección, se coloca la IP del server

    - name: Hola Mundo
      run: echo "Hola mundo"

    - name: Crear archivo
      run: touch hola.txt

    - name: Set text
      run: echo "Hola mundo" > hola.txt

    - name: Mostrar contenido
      run: cat hola.txt

  other:
    runs-on: ubuntu-latest
    needs: [hola] #Necesita que el job hola termine para poder ejecutarse
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Listar
      run: ls -al